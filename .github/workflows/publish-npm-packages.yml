# @ziggs-ai/api-client, @ziggs-ai/agent-sdk, @ziggs-ai/ziggs-mcp, @ziggs-ai/ziggs-cli
# — public npm publish with provenance (ZIG-2257).
#
# Auth: long-lived NPM_TOKEN (GAT) still publishes. Trusted-publisher OIDC
# (`npm trust`) needs an interactive 2FA session on the package owner and
# is a follow-up — bypass-2FA tokens are refused for the trust API.
# Provenance is minted via id-token + --provenance on this public repo.
#
# Trigger: tag push only (not branch pushes).
#   git tag release-<id> && git push origin release-<id>   (every package not on npm yet, one run)
#   git tag api-client-v0.1.0 && git push origin api-client-v0.1.0
#   git tag agent-sdk-v0.1.0 && git push origin agent-sdk-v0.1.0
#   git tag ziggs-mcp-v0.1.0 && git push origin ziggs-mcp-v0.1.0
#   git tag ziggs-cli-v0.1.0 && git push origin ziggs-cli-v0.1.0
#
# Publish order: api-client first (ziggs-mcp dep), then agent-sdk /
# ziggs-mcp / ziggs-cli.
# A version bump of api-client or ziggs-mcp files its Unreleased changelog
# notes under that version first: node scripts/changelog-release.mjs --write
# The test job fails the tag when that heading is missing.
# A ziggs-mcp tag also publishes server.json to the MCP registry, as the job
# after publish-ziggs-mcp (see publish-mcp-registry.yml).

name: Publish npm packages

on:
  push:
    tags:
      # One release tag publishes every package whose version is not on npm
      # yet, in dependency order, after one test run. The per-package tags
      # below still work for a single package.
      - 'release-*'
      - 'api-client-v*'
      - 'agent-sdk-v*'
      - 'ziggs-mcp-v*'
      - 'ziggs-cli-v*'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build api-client (dist required after ZIG-430 entry change)
        run: npm run build -w @ziggs-ai/api-client

      - name: Typecheck agent-sdk (ZIG-619 — tsc --noEmit must stay green)
        run: npm run typecheck -w @ziggs-ai/agent-sdk

      - name: Run unit tests
        run: |
          if [[ "${{ github.ref_name }}" == agent-sdk-v* ]]; then
            npm run build -w @ziggs-ai/agent-sdk
            npm test -w @ziggs-ai/api-client -w @ziggs-ai/agent-sdk -w @ziggs-ai/ziggs-mcp
          else
            npm test
          fi

  publish-release:
    if: startsWith(github.ref_name, 'release-')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      mcp: ${{ steps.publish.outputs.mcp }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm for provenance
        run: npm install -g npm@11.5.1

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build
        run: |
          npm run build -w @ziggs-ai/api-client
          npm run build -w @ziggs-ai/agent-sdk
          npm run build -w @ziggs-ai/ziggs-mcp

      - name: Publish what is not on npm yet, in dependency order
        id: publish
        # A version already on npm is skipped; a failed publish fails the job.
        # A prerelease version (x.y.z-next.n) goes to the next dist-tag.
        run: |
          set -euo pipefail
          for entry in "api-client @ziggs-ai/api-client" "agent-sdk @ziggs-ai/agent-sdk" "ziggs-mcp @ziggs-ai/ziggs-mcp" "ziggs-cli @ziggs-ai/ziggs-cli"; do
            set -- $entry
            dir=$1
            name=$2
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            if [ "$dir" = ziggs-cli ]; then
              (cd ziggs-cli && npm publish --access public --provenance --tag "$tag")
            else
              npm publish -w "$name" --access public --provenance --tag "$tag"
            fi
            echo "published $name@$version"
            if [ "$dir" = ziggs-mcp ]; then
              echo "mcp=true" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-release-mcp-registry:
    if: needs.publish-release.outputs.mcp == 'true'
    needs: publish-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml

  publish-api-client:
    if: startsWith(github.ref_name, 'api-client-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm for provenance
        run: npm install -g npm@11.5.1

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build @ziggs-ai/api-client
        run: npm run build -w @ziggs-ai/api-client

      - name: Publish @ziggs-ai/api-client
        # A prerelease version (x.y.z-next.n) goes to the next dist-tag, so a plain install keeps getting latest.
        run: |
          tag=latest
          case "$(node -p "require('./api-client/package.json').version")" in *-*) tag=next ;; esac
          npm publish -w @ziggs-ai/api-client --access public --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-agent-sdk:
    if: startsWith(github.ref_name, 'agent-sdk-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm for provenance
        run: npm install -g npm@11.5.1

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build @ziggs-ai/api-client (workspace dep)
        run: npm run build -w @ziggs-ai/api-client

      - name: Build @ziggs-ai/agent-sdk
        run: npm run build -w @ziggs-ai/agent-sdk

      - name: Publish @ziggs-ai/agent-sdk
        # A prerelease version (x.y.z-next.n) goes to the next dist-tag, so a plain install keeps getting latest.
        run: |
          tag=latest
          case "$(node -p "require('./agent-sdk/package.json').version")" in *-*) tag=next ;; esac
          npm publish -w @ziggs-ai/agent-sdk --access public --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ziggs-mcp:
    if: startsWith(github.ref_name, 'ziggs-mcp-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm for provenance
        run: npm install -g npm@11.5.1

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build @ziggs-ai/api-client (workspace dep needs dist)
        run: npm run build -w @ziggs-ai/api-client

      - name: Build @ziggs-ai/ziggs-mcp
        run: npm run build -w @ziggs-ai/ziggs-mcp

      - name: Publish @ziggs-ai/ziggs-mcp
        run: npm publish -w @ziggs-ai/ziggs-mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    if: startsWith(github.ref_name, 'ziggs-mcp-v')
    needs: publish-ziggs-mcp
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml

  publish-ziggs-cli:
    if: startsWith(github.ref_name, 'ziggs-cli-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm for provenance
        run: npm install -g npm@11.5.1

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build @ziggs-ai/api-client (workspace dep needs dist)
        run: npm run build -w @ziggs-ai/api-client

      - name: Build @ziggs-ai/ziggs-mcp (the CLI imports its operations export from dist)
        run: npm run build -w @ziggs-ai/ziggs-mcp

      - name: Publish @ziggs-ai/ziggs-cli
        run: (cd ziggs-cli && npm publish --access public --provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
